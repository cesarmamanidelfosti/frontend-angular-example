sonar.projectKey=demo-frontend
sonar.projectName=DEMO - Frontend Angular
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/environments/**,**/main.ts
sonar.javascript.lcov.reportPaths=coverage/frontend-angular-example/lcov.info
sonar.typescript.lcov.reportPaths=coverage/frontend-angular-example/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
