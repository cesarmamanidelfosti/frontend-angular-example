<div *ngIf="loading" class="loading-spinner">
  <p>Cargando datos...</p>
</div>

<div *ngIf="!loading && error" class="error-message">
  <p>No se pudieron cargar los datos del dashboard.</p>
</div>

<div *ngIf="!loading && !error && data">
  <h1>Dashboard</h1>

  <section>
    <p>Activos: {{ data?.kpiPrimary?.activeCount | number }}</p>
    <p>Inactivos: {{ data?.kpiPrimary?.inactiveCount | number }}</p>
  </section>

  <section>
    <span
      [ngClass]="{
        'text-emerald-600': data?.kpiAlert?.status === 'normal',
        'text-amber-500': data?.kpiAlert?.status === 'warning',
        'text-red-500': data?.kpiAlert?.status === 'critical',
      }"
    >
      {{ data?.kpiAlert?.percentage }}%
    </span>
    <p>Última actualización: {{ data?.lastUpdatedAt }}</p>
  </section>
</div>
